<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="desktop">

    <!-- =========================
         伪窗口 1
         ========================= -->
    <div class="fake-window"
         style="
            width: 520px;
            height: 320px;
            left: 120px;
            top: 80px;
         ">

        <div class="window-titlebar">
            <div class="window-title">
                <img src="assets/icon-computer.png" alt="">
                <span>我的电脑</span>
            </div>

            <!-- 仅装饰，不可操作 -->
            <div class="window-controls">
                <div class="window-control minimize">−</div>
                <div class="window-control maximize">□</div>
                <div class="window-control close">×</div>
            </div>
        </div>

        <div class="window-content">

            <h2>我的电脑</h2>

            <p>
                这是一个伪 Win10 窗口。
            </p>

            <div class="example-box">
                <strong>本地磁盘 (C:)</strong>
                <br>
                没有磁盘
            </div>

            <p>
                窗口可以拖动，但不能最小化、最大化或者关闭。
            </p>

        </div>
    </div>


    <!-- =========================
         伪窗口 2
         ========================= -->
    <div class="fake-window"
         style="
            width: 600px;
            height: 400px;
            left: 720px;
            top: 140px;
         ">

        <div class="window-titlebar">

            <div class="window-title">
                <img src="assets/icon-notepad.png" alt="">
                <span>记事本</span>
            </div>

            <div class="window-controls">
                <div class="window-control minimize">−</div>
                <div class="window-control maximize">□</div>
                <div class="window-control close">×</div>
            </div>

        </div>

        <div class="window-content">

            <h2>欢迎</h2>

            <p>
                这里可以放任意 HTML。
            </p>

            <p>
                例如：
            </p>

            <ul>
                <li>图片</li>
                <li>文字</li>
                <li>按钮</li>
                <li>表格</li>
                <li>或者其他 HTML 结构</li>
            </ul>

            <button class="demo-button">
                示例按钮
            </button>

        </div>
    </div>


    <!-- =========================
         伪窗口 3
         ========================= -->
    <div class="fake-window"
         style="
            width: 420px;
            height: 260px;
            left: 380px;
            top: 430px;
         ">

        <div class="window-titlebar">

            <div class="window-title">
                <img src="assets/icon-info.png" alt="">
                <span>关于</span>
            </div>

            <div class="window-controls">
                <div class="window-control minimize">−</div>
                <div class="window-control maximize">□</div>
                <div class="window-control close">×</div>
            </div>

        </div>

        <div class="window-content">
            <p>AI写的。改了点字。还没画图片。大概会咕咕咕。</p>

        </div>
    </div>


    <!-- =========================
         装饰性的任务栏
         实际上不是任务栏
         ========================= -->
    <div class="fake-taskbar"></div>

</div>

<script src="js.js"></script>

</body>
</html>
